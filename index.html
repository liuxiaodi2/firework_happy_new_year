<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新年快乐！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #0a0a1a 0%, #1a1a3a 50%, #0a0a2a 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        .title {
            font-size: clamp(2.5rem, 12vw, 5rem);
            font-weight: 900;
            background: linear-gradient(135deg,
                #ff6b6b 0%,
                #ffd93d 20%,
                #ff8c42 40%,
                #ff3cac 60%,
                #ffd93d 80%,
                #ff6b6b 100%
            );
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 200, 100, 0.5);
            animation: gradient 3s ease infinite, breathe 2s ease-in-out infinite;
            letter-spacing: 0.1em;
        }

        .subtitle {
            font-size: clamp(0.9rem, 4vw, 1.5rem);
            color: rgba(255, 255, 255, 0.8);
            margin-top: 20px;
            animation: fadeInUp 1s ease 0.5s both;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            z-index: 10;
            animation: fadeInUp 1s ease 1s both;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes breathe {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 20px rgba(255, 200, 100, 0.5));
            }
            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 40px rgba(255, 200, 100, 0.8));
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 星星背景 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <canvas id="canvas"></canvas>

    <div class="content">
        <div class="title">新年快乐！</div>
        <div class="subtitle">愿新的一年，万事如意，心想事成</div>
    </div>

    <div class="hint">点击屏幕任意位置放烟花</div>

    <script>
        // Canvas设置
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let fireworks = [];
        let particles = [];
        let lastTime = 0;
        let autoFireworkTimer = 0;
        const AUTO_FIREWORK_INTERVAL = 800;

        // 颜色配置 - 新年主题色
        const colors = [
            { r: 255, g: 107, b: 107 },   // 红色
            { r: 255, g: 217, b: 61 },   // 金黄色
            { r: 255, g: 140, b: 66 },   // 橙色
            { r: 255, g: 60, b: 172 },   // 粉色
            { r: 99, g: 220, b: 255 },   // 青色
            { r: 255, g: 255, b: 255 },  // 白色
            { r: 138, g: 43, b: 226 },   // 紫色
            { r: 0, g: 255, b: 127 },    // 青绿色
        ];

        // 调整画布大小
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // 随机数生成
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function randomInt(min, max) {
            return Math.floor(random(min, max + 1));
        }

        function randomColor() {
            return colors[randomInt(0, colors.length - 1)];
        }

        // 烟花类
        class Firework {
            constructor(x, y, targetY) {
                this.x = x;
                this.y = height;
                this.targetY = targetY;
                this.speed = random(8, 12);
                this.color = randomColor();
                this.trail = [];
                this.trailLength = 10;
                this.exploded = false;
            }

            update() {
                // 记录拖尾
                this.trail.push({ x: this.x, y: this.y, alpha: 1 });
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }

                // 更新拖尾透明度
                this.trail.forEach(t => t.alpha -= 0.1);

                // 向上移动
                this.y -= this.speed;
                this.speed *= 0.98;

                // 检测是否到达目标高度
                if (this.y <= this.targetY || this.speed < 1) {
                    this.exploded = true;
                    this.explode();
                }
            }

            draw() {
                // 绘制拖尾
                ctx.save();
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                for (let i = 0; i < this.trail.length - 1; i++) {
                    const t1 = this.trail[i];
                    const t2 = this.trail[i + 1];

                    ctx.beginPath();
                    ctx.moveTo(t1.x, t1.y);
                    ctx.lineTo(t2.x, t2.y);
                    ctx.strokeStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${t1.alpha})`;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                // 绘制烟花头部
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = `rgb(${this.color.r}, ${this.color.g}, ${this.color.b})`;
                ctx.fill();

                // 发光效果
                ctx.shadowBlur = 15;
                ctx.shadowColor = `rgb(${this.color.r}, ${this.color.g}, ${this.color.b})`;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.restore();
            }

            explode() {
                const particleCount = randomInt(80, 150);

                // 爆炸形状：球形
                for (let i = 0; i < particleCount; i++) {
                    const angle = (i / particleCount) * Math.PI * 2;
                    const velocity = random(2, 8);
                    particles.push(new Particle(
                        this.x,
                        this.y,
                        Math.cos(angle) * velocity,
                        Math.sin(angle) * velocity,
                        this.color
                    ));
                }

                // 额外的中心闪光
                for (let i = 0; i < 20; i++) {
                    const angle = random(0, Math.PI * 2);
                    const velocity = random(1, 3);
                    particles.push(new Particle(
                        this.x,
                        this.y,
                        Math.cos(angle) * velocity,
                        Math.sin(angle) * velocity,
                        { r: 255, g: 255, b: 255 }
                    ));
                }
            }
        }

        // 粒子类
        class Particle {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.alpha = 1;
                this.friction = random(0.95, 0.98);
                this.gravity = random(0.05, 0.15);
                this.decay = random(0.008, 0.02);
                this.size = random(1, 3);
                this.trail = [];
                this.trailLength = 5;
            }

            update() {
                // 记录拖尾
                this.trail.push({ x: this.x, y: this.y, alpha: this.alpha });
                if (this.trail.length > this.trailLength) {
                    this.trail.shift();
                }

                // 物理更新
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;

                this.x += this.vx;
                this.y += this.vy;

                this.alpha -= this.decay;
            }

            draw() {
                // 绘制拖尾
                ctx.save();
                ctx.lineCap = 'round';

                for (let i = 0; i < this.trail.length - 1; i++) {
                    const t1 = this.trail[i];
                    const t2 = this.trail[i + 1];

                    ctx.beginPath();
                    ctx.moveTo(t1.x, t1.y);
                    ctx.lineTo(t2.x, t2.y);
                    ctx.strokeStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${t1.alpha * 0.5})`;
                    ctx.lineWidth = this.size * 0.5;
                    ctx.stroke();
                }

                ctx.restore();

                // 绘制粒子
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgb(${this.color.r}, ${this.color.g}, ${this.color.b})`;
                ctx.fill();

                // 发光效果
                ctx.shadowBlur = 10;
                ctx.shadowColor = `rgb(${this.color.r}, ${this.color.g}, ${this.color.b})`;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.restore();
            }

            isDead() {
                return this.alpha <= 0;
            }
        }

        // 创建烟花
        function createFirework(x, targetY) {
            fireworks.push(new Firework(x, height, targetY));
        }

        // 动画循环
        function animate(currentTime) {
            requestAnimationFrame(animate);

            // 计算delta time
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            // 清除画布（带拖尾效果）
            ctx.fillStyle = 'rgba(10, 10, 26, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // 自动发射烟花
            autoFireworkTimer += deltaTime;
            if (autoFireworkTimer >= AUTO_FIREWORK_INTERVAL) {
                autoFireworkTimer = 0;
                const x = random(width * 0.2, width * 0.8);
                const targetY = random(height * 0.1, height * 0.4);
                createFirework(x, targetY);
            }

            // 更新和绘制烟花
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const firework = fireworks[i];
                firework.update();
                firework.draw();

                if (firework.exploded) {
                    fireworks.splice(i, 1);
                }
            }

            // 更新和绘制粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.update();
                particle.draw();

                if (particle.isDead()) {
                    particles.splice(i, 1);
                }
            }
        }

        // 点击/触摸事件
        function handleInteraction(e) {
            e.preventDefault();
            let clientX, clientY;

            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            // 在点击位置下方发射烟花
            createFirework(clientX, clientY * 0.6);

            // 额外发射几枚增加效果
            setTimeout(() => createFirework(clientX + random(-50, 50), clientY * 0.5), 100);
            setTimeout(() => createFirework(clientX + random(-50, 50), clientY * 0.55), 200);
        }

        canvas.addEventListener('click', handleInteraction);
        canvas.addEventListener('touchstart', handleInteraction, { passive: false });

        // 创建星星背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = random(0, 100) + '%';
                star.style.top = random(0, 100) + '%';
                star.style.width = random(1, 3) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = random(0, 2) + 's';
                starsContainer.appendChild(star);
            }
        }

        // 初始化
        function init() {
            createStars();

            // 初始发射几枚烟花
            setTimeout(() => createFirework(width * 0.5, height * 0.3), 500);
            setTimeout(() => createFirework(width * 0.3, height * 0.25), 800);
            setTimeout(() => createFirework(width * 0.7, height * 0.35), 1100);
            setTimeout(() => createFirework(width * 0.4, height * 0.2), 1500);
            setTimeout(() => createFirework(width * 0.6, height * 0.28), 1800);

            // 开始动画
            animate(0);
        }

        // 页面加载完成后初始化
        window.addEventListener('load', init);

        // 防止移动端下拉刷新
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
